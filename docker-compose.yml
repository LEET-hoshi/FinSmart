services:
  offers-updater:
    build:
      context: .
      dockerfile: tools/offers-updater/Dockerfile
    environment:
      OFFERS_MODE: ${OFFERS_MODE:-live}
    volumes:
      - offers_catalog:/workspace/build/generated/fixtures

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsmart}
      POSTGRES_USER: ${POSTGRES_USER:-finsmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsmart}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsmart} -d ${POSTGRES_DB:-finsmart}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-finsmart}
      DB_USER: ${POSTGRES_USER:-finsmart}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-finsmart}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      OFFERS_FILE: /app/fixtures/offers/offers.json
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_IMPORT_PER_MINUTE: ${RATE_LIMIT_IMPORT_PER_MINUTE:-10}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-5}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - offers_catalog:/app/fixtures:ro
    depends_on:
      offers-updater:
        condition: service_completed_successfully
      db:
        condition: service_healthy

volumes:
  pgdata:
  offers_catalog:
