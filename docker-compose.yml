services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finsmart}
      POSTGRES_USER: ${POSTGRES_USER:-finsmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsmart}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finsmart} -d ${POSTGRES_DB:-finsmart}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-finsmart}
      DB_USER: ${POSTGRES_USER:-finsmart}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-finsmart}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      OFFERS_FILE: /app/fixtures/offers/offers.json
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ${FIXTURES_DIR:-./fixtures}:/app/fixtures:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
